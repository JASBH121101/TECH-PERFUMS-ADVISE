name: JBAE GitHub Pages

on:
  push:
    branches:
      - feature/jbae-standalone-android-app
    paths:
      - "apps/mobile/**"
      - "src/**"
      - "data/fragrance/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jbae-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Test app
        working-directory: apps/mobile
        run: npm test
      - name: Build searchable CoreInfo technology catalogue
        working-directory: apps/mobile
        run: node scripts/build-technology-catalog.mjs
      - name: Probe primary specification sources through JBAE gateway
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 100 "https://jbae-specs-api.jaredblancoh19.workers.dev/probe" -o /tmp/jbae-source-probe.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync("/tmp/jbae-source-probe.json", "utf8"));
            for (const item of result.results ?? []) {
              console.log(JSON.stringify({url:item.requestedUrl,status:item.status,finalUrl:item.finalUrl,title:item.title,bytes:item.bytes,error:item.error ?? null}));
            }
          '
      - name: Build Pages bundle and fragrance seed
        working-directory: apps/mobile
        env:
          GITHUB_PAGES: "true"
          VITE_APP_VERSION: "WEB PREVIEW"
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icons/jbae-192.svg
          test -s dist/icons/jbae-512.svg
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
