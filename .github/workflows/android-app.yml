name: JBAE Android App

on:
  push:
    branches:
      - feature/jbae-standalone-android-app
    paths:
      - "apps/mobile/**"
      - "src/**"
      - "data/fragrance/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbae-android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and test standalone Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Test mobile search and app utilities
        working-directory: apps/mobile
        run: npm test

      - name: Build mobile web bundle and offline seed
        working-directory: apps/mobile
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx cap add android

      - name: Sync Capacitor plugins and web assets
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jbae-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
