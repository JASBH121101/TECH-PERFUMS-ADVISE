name: JBAE live provider smoke tests

on:
  push:
    branches:
      - feature/jb-advisor-engine
    paths:
      - "src/research/providers.js"
      - "scripts/provider-smoke-test.js"
      - "package.json"
      - ".github/workflows/provider-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbae-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded live provider checks
        run: npm run smoke:providers
