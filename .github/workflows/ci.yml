name: JB Advisor Engine CI

on:
  push:
    branches:
      - main
      - feature/jb-advisor-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node.js 22 validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run checks
        run: |
          node --check src/index.js
          npm test
